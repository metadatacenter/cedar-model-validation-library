name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push to develop publishes, so only ever cancel superseded
  # pull-request and manual runs.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: Maven tests (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The meta-schemas in src/main/resources are generated from the fragments in schema/, and
      # regenerating them must reproduce the committed files byte for byte. Otherwise a meta-schema
      # edited by hand loses its edit at the next regeneration, and a fragment edited alone changes
      # nothing until then. The generator needs jq, which the runner image has, and sponge, which
      # comes from moreutils.
      - name: Check the meta-schemas against their fragments
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq moreutils
          (cd scripts && ./generate-meta-schemas.sh)
          git diff --exit-code -- src/main/resources

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # setup-java's Maven cache restores only an exact match on the POMs, so a version bump, which
      # every release makes twice, started the build from an empty repository. Falling back to the
      # newest earlier cache keeps every third-party artifact the bump did not change.
      - name: Restore the Maven repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress --update-snapshots verify --settings .m2/nexus-settings.xml

      # Other repositories resolve this artifact from Nexus, so a merged change
      # is invisible to their builds until the snapshot is republished. Tests have
      # already run in the step above; this only uploads what they verified.
      - name: Publish the snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./mvnw --batch-mode --no-transfer-progress deploy -DskipTests --settings .m2/nexus-settings.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: warn

      # cedar-parent attaches JaCoCo to every test run, and each module that ran tests writes a
      # report: target/site/jacoco for Surefire suites and target/site/jacoco-it for Failsafe ones.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: "**/target/site/jacoco*/**"
          if-no-files-found: warn
